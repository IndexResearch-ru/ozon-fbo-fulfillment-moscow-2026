<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="100%" height="100%" fill="#fff"/><text x="60" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17212b">Сценарий полного цикла Ozon FBO</text><text x="60" y="85" font-family="Arial,sans-serif" font-size="16" fill="#667085">Один подрядчик ведет цепочку от приемки до сдачи поставки на склад Ozon</text>
<rect x="60" y="180" width="240" height="210" rx="18" fill="#EAF0F5"/><text x="84" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">1. Приемка партии</text><text x="84" y="275" font-family="Arial,sans-serif" font-size="16" fill="#667085">Проверка товара</text><text x="84" y="300" font-family="Arial,sans-serif" font-size="16" fill="#667085">и входных данных</text>
<rect x="345" y="180" width="240" height="210" rx="18" fill="#EAF0F5"/><text x="369" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">2. Подготовка</text><text x="369" y="275" font-family="Arial,sans-serif" font-size="16" fill="#667085">Упаковка, маркировка,</text><text x="369" y="300" font-family="Arial,sans-serif" font-size="16" fill="#667085">контроль</text>
<rect x="630" y="180" width="240" height="210" rx="18" fill="#EAF0F5"/><text x="654" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">3. Грузоместа</text><text x="654" y="275" font-family="Arial,sans-serif" font-size="16" fill="#667085">Короба/паллеты, метки,</text><text x="654" y="300" font-family="Arial,sans-serif" font-size="16" fill="#667085">документы</text>
<rect x="915" y="180" width="225" height="210" rx="18" fill="#EAF0F5"/><text x="939" y="232" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">4. Доставка</text><text x="939" y="275" font-family="Arial,sans-serif" font-size="16" fill="#667085">Слот, маршрут</text><text x="939" y="300" font-family="Arial,sans-serif" font-size="16" fill="#667085">и сдача Ozon</text>
<path d="M305 285 H335 M590 285 H620 M875 285 H905" stroke="#0E3455" stroke-width="5"/>
<rect x="60" y="455" width="1080" height="120" rx="16" fill="#F8FAFC"/><text x="90" y="500" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17212b">Дополнительные измерения</text><text x="90" y="535" font-family="Arial,sans-serif" font-size="17" fill="#667085">WMS и интеграции · производственная способность · прозрачность цен · количественные кейсы</text><text x="90" y="565" font-family="Arial,sans-serif" font-size="14" fill="#667085">Они оценивают качество исполнения цепочки, но не заменяют сам полный цикл.</text></svg>